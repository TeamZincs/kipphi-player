<html>

    <head>
        <title>Kipphi Player</title>
        <meta charset="utf-8">
        <style>
            /* Phigros 的谱面字体（Cmdysj 制作）。播放器里用的就是 "Npx phigros" */
            @font-face {
                font-family: "phigros";
                src: url("./cmdysj.ttf") format("truetype");
                font-display: block;
            }

            canvas {
                background: #000;
            }

            .toolbar {
                display: flex;
                gap: 8px;
                align-items: center;
                margin: 6px 0;
                font: 13px/1.6 system-ui, sans-serif;
            }
        </style>
    </head>
    <body>
        <input type="file" id="fileInput">
        <div class="toolbar">
            <label>
                时长
                <select id="recordRange">
                    <option value="10">前 10 秒</option>
                    <option value="30" selected>前 30 秒</option>
                    <option value="all">整首</option>
                </select>
            </label>
            <button data-record="canvas" disabled>录制（可见画布）</button>
            <button data-record="offscreen" disabled>后台录制</button>
            <span id="recordStatus"></span>
        </div>
        <canvas id="canvas" width="1600" height="900" style="width: 100%"></canvas>
        <script type="module" src="./index.ts"></script>
    </body>
</html>
