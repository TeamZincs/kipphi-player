name: Deploy to GitHub Pages

on:
  # 触发条件：推送到主分支或手动触发
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:  # 允许手动触发

# 权限配置 - 必须要有这个！
permissions:
  contents: read      # 读取仓库内容
  pages: write        # 写入 Pages
  id-token: write     # 生成 OIDC 令牌

# 并发控制
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # vite 需要较新的 Node（vite 8 要求 20.19+ / 22.12+）
      - name: 设置 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 设置 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 安装播放器依赖
        run: bun install

      # demo 里 import 的是 ".."，走根 package.json 的 main（index.js），
      # 所以要先构建播放器本体
      - name: 构建播放器
        run: bun run build

      - name: 安装 demo 依赖
        run: bun install
        working-directory: ./demo

      # 交给 vite：TS 转译、unzip.worker 分块、public/ 静态资源都由它处理
      - name: 构建 demo
        run: npx vite build
        working-directory: ./demo

      - name: 验证构建结果
        run: |
          echo "📁 构建目录内容:"
          ls -R dist | head -40
          echo -e "\n📄 index.html 预览:"
          head -20 dist/index.html
        working-directory: ./demo

      - name: 上传 Pages 制品
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./demo/dist

  deploy:
    # 部署环境
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
